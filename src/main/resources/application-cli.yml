# 콘솔 대화 모드(cli 프로파일) 전용 설정
# --spring.profiles.active=cli 로 실행하면 application.yml 위에 이 파일의 값이 덮어써집니다.
spring:
  main:
    # 웹 서버(톰캣)를 띄우지 않습니다. CommandLineRunner(ConsoleChatRunner)만 실행됩니다.
    web-application-type: none
    banner-mode: "off"   # YAML 에서 off 는 불리언으로 해석될 수 있어 따옴표로 감쌉니다.

# 콘솔 화면이 로그로 지저분해지지 않도록 로그 레벨을 낮춥니다.
# - 요청/응답 전체 로그(SimpleLoggerAdvisor)는 끔 → 보고 싶으면 DEBUG 로 변경
# - 도구 실행 로그("[Tool] ...", "Executing tool call: ...")와 측정 로그("[Metrics] ...")는 그대로 보입니다.
# - "[Agent] ..." 로그(DEBUG)는 콘솔 화면과 겹치므로 끕니다.
logging:
  level:
    org.springframework.ai.chat.client.advisor: WARN
    com.example.springai: INFO
